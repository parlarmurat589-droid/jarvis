    body {

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    .arc-reactor {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #00f2ff;
      box-shadow: 0 0 20px #00f2ff, inset 0 0 20px #00f2ff;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 15px #00f2ff, inset 0 0 15px #00f2ff; }
      50% { box-shadow: 0 0 30px #00f2ff, inset 0 0 30px #00f2ff; }
      100% { box-shadow: 0 0 15px #00f2ff, inset 0 0 15px #00f2ff; }
    }
    .core {
      width: 60px;
      height: 60px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px #ffffff;
    }
    #status {
      font-size: 1.2rem;
      margin-bottom: 20px;
