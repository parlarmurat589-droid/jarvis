<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0b0f19;
      color: #00f2ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    .arc-reactor {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #00f2ff;
      box-shadow: 0 0 20px #00f2ff, inset 0 0 20px #00f2ff;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 15px #00f2ff, inset 0 0 15px #00f2ff; }
      50% { box-shadow: 0 0 30px #00f2ff, inset 0 0 30px #00f2ff; }
      100% { box-shadow: 0 0 15px #00f2ff, inset 0 0 15px #00f2ff; }
    }
    .core {
      width: 60px;
      height: 60px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px #ffffff;
    }
    #status {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    #chat-box {
      background: rgba(0, 242, 255, 0.05);
      border: 1px solid #00f2ff;
      border-radius: 10px;
      padding: 15px;
      min-height: 100px;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 20px;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>JARVIS</h1>
  <div class="arc-reactor" id="mic-btn">
    <div class="core"></div>
  </div>
  <div id="status">Komut bekliyor...</div>
  <div id="chat-box"></div>
</div>

<script>
  const micBtn = document.getElementById('mic-btn');
  const status = document.getElementById('status');
  const chatBox = document.getElementById('chat-box');

  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (Recognition) {
    const recognition = new Recognition();
    recognition.lang = 'tr-TR';

    micBtn.addEventListener('click', () => {
      recognition.start();
      status.innerText = "Dinleniyor...";
    });

    recognition.onresult = (event) => {
      const text = event.results[0][0].transcript.toLowerCase();
      status.innerText = "İşleniyor...";
      chatBox.innerHTML += `<p><b>Siz:</b> ${text}</p>`;

      // Spotify Tetikleme Kontrolü
      if (text.includes("spotify")) {
        chatBox.innerHTML += `<p><b>Jarvis:</b> Derhal Murat Bey, Spotify sistemini devreye sokuyorum.</p>`;
        status.innerText = "Spotify açılıyor...";
        
        // Android Intent ile MacroDroid tetikleme
        window.location.href = "intent://action?name=spotify#Intent;scheme=macrodroid;package=com.arlosoft.macrodroid;end";
      } else {
        chatBox.innerHTML += `<p><b>Jarvis:</b> Komut anlaşıldı Murat Bey.</p>`;
        status.innerText = "Komut alındı.";
      }
    };

    recognition.onerror = () => {
      status.innerText = "Ses anlaşılamadı.";
    };
  } else {
    status.innerText = "Tarayıcınız ses tanımayı desteklemiyor.";
  }
</script>

</body>
</html>
