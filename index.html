<div class="container">
  <h1>JARVIS</h1>
  
  <div class="arc-reactor" id="mic-btn">
    <div class="core"></div>
  </div>

  <div id="status">Ekrana bir kez dokunun...</div>
  <div id="chat-box"></div>

  <div class="input-group">
    <input type="text" id="user-input" placeholder="Jarvis'e bir şeyler yazın...">
    <button id="send-btn">Gönder</button>
  </div>

  <!-- Tarayıcı içi API Ayar Paneli (Prompt hatasını tamamen çözer) -->
  <div class="api-section">
    <input type="password" id="api-key-input" placeholder="Gemini API Anahtarınızı buraya yapıştırın">
    <button id="save-api-btn">🔑 API Anahtarını Kaydet</button>
  </div>
</div>

<script>
const micBtn = document.getElementById('mic-btn');
const statusText = document.getElementById('status');
const chatBox = document.getElementById('chat-box');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const apiKeyInput = document.getElementById('api-key-input');
const saveApiBtn = document.getElementById('save-api-btn');

let audioUnlocked = false;

// Sayfa açıldığında önceden kaydedilmiş API anahtarını kutuya doldur
window.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('JARVIS_API_KEY');
  if (savedKey) {
    apiKeyInput.value = savedKey;
  }
});

// Kaydet butonuna basınca hafızaya al
saveApiBtn.addEventListener('click', () => {
  const key = apiKeyInput.value.trim();
  if (key) {
    localStorage.setItem('JARVIS_API_KEY', key);
    statusText.innerText = 'API Anahtarı kaydedildi! 🚀';
    speak('API anahtarı başarıyla kaydedildi Murat Usta.');
  } else {
    statusText.innerText = '⚠️ Lütfen geçerli bir anahtar girin.';
  }
});

// Mobil ses izni
document.body.addEventListener('click', () => {
  if (!audioUnlocked) {
    const initUtterance = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(initUtterance);
    audioUnlocked = true;
    statusText.innerText = 'Hazır...';
  }
}, { once: true });

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'tr-TR';
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}

async function processCommand(text) {
  if (!text || !text.trim()) return;

  chatBox.innerHTML += `<p style="color:#ffffff;"><b>Siz:</b> ${text}</p>`;
  const lowerText = text.toLowerCase();

  // 1. Youtube Komutu
  if (lowerText.includes('youtube')) {
    const reply = "Derhal Murat Usta, YouTube sistemini devreye sokuyorum.";
    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "YouTube açılıyor...";
    speak(reply);
    setTimeout(() => {
      window.location.href = "intent://www.youtube.com#Intent;scheme=https;package=com.google.android.youtube;end";
    }, 1200);
    userInput.value = '';
    return;
  }

  // 2. Spotify Komutu
  if (lowerText.includes('spotify')) {
    const reply = "Derhal Murat Bey, Spotify sistemini devralıyorum.";
    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "Spotify açılıyor...";
    speak(reply);
    setTimeout(() => {
      window.location.href = "intent://com.spotify.music/#Intent;scheme=android-app;end";
    }, 1200);
    userInput.value = '';
    return;
  }

  // API Anahtarını al
  const apiKey = localStorage.getItem('JARVIS_API_KEY');
  if (!apiKey) {
    statusText.innerText = '⚠️ Önce alttan API anahtarınızı kaydedin!';
    speak('Lütfen önce API anahtarınızı kaydedin Murat Usta.');
    return;
  }

  // 3. Gemini Akıllı Cevap Mekanizması
  statusText.innerText = "Jarvis düşünüyor...";
  const prompt = `Sen Marvel evrenindeki sinematik yapay zeka JARVIS'sin. Seni orijinalde Tony Stark yarattı fakat bu dijital boyutta seni kodlayan, geliştiren dahi mühendis Murat'tır. Kullanıcın Murat "kendini tanıt" derse veya soru sorarsa son derece havalı, saygılı, kısa ve öz yanıt ver. Asla kod veya sembol kullanma.\n\nKullanıcı: ${text}`;

  try {
    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-goog-api-key': apiKey
      },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await response.json();
    let reply = "";

    if (data.candidates && data.candidates[0].content.parts[0].text) {
      reply = data.candidates[0].content.parts[0].text;
    } else {
      reply = `Anlaşıldı Murat Bey: ${text}`;
    }

    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "Komut işlendi.";
    speak(reply);

  } catch (err) {
    const reply = `Anlaşıldı Murat Bey: ${text}`;
    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "İşlendi.";
    speak(reply);
  }

  chatBox.scrollTop = chatBox.scrollHeight;
  userInput.value = '';
}

sendBtn.addEventListener('click', () => {
  processCommand(userInput.value);
});

userInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    processCommand(userInput.value);
  }
});

// Ses Tanıma
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = 'tr-TR';

  micBtn.addEventListener('click', () => {
    recognition.start();
    statusText.innerText = 'Dinleniyor...';
  });

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    userInput.value = text;
    processCommand(text);
  };

  recognition.onerror = () => {
    statusText.innerText = 'Ses anlaşılamadı.';
  };
} else {
  statusText.innerText = 'Tarayıcı ses tanımayı desteklemiyor.';
}
</script>

</body>

  const savedKey = localStorage.getItem('JARVIS_API_KEY');
  if (savedKey) {
    apiKeyInput.value = savedKey;
  }
});

// Kaydet butonuna basınca hafızaya al
saveApiBtn.addEventListener('click', () => {
  const key = apiKeyInput.value.trim();
  if (key) {
    localStorage.setItem('JARVIS_API_KEY', key);
    statusText.innerText = 'API Anahtarı kaydedildi! 🚀';
    speak('API anahtarı başarıyla kaydedildi Murat Usta.');
  } else {
    statusText.innerText = '⚠️ Lütfen geçerli bir anahtar girin.';
  }
});

// Mobil ses izni
document.body.addEventListener('click', () => {
  if (!audioUnlocked) {
    const initUtterance = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(initUtterance);
    audioUnlocked = true;
    statusText.innerText = 'Hazır...';
  }
}, { once: true });

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'tr-TR';
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}

async function processCommand(text) {
  if (!text || !text.trim()) return;

  chatBox.innerHTML += `<p style="color:#ffffff;"><b>Siz:</b> ${text}</p>`;
  const lowerText = text.toLowerCase();

  // 1. Youtube Komutu
  if (lowerText.includes('youtube')) {
    const reply = "Derhal Murat Usta, YouTube sistemini devreye sokuyorum.";
    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "YouTube açılıyor...";
    speak(reply);
    setTimeout(() => {
      window.location.href = "intent://www.youtube.com#Intent;scheme=https;package=com.google.android.youtube;end";
    }, 1200);
    userInput.value = '';
    return;
  }

  // 2. Spotify Komutu
  if (lowerText.includes('spotify')) {
    const reply = "Derhal Murat Bey, Spotify sistemini devralıyorum.";
    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "Spotify açılıyor...";
    speak(reply);
    setTimeout(() => {
      window.location.href = "intent://com.spotify.music/#Intent;scheme=android-app;end";
    }, 1200);
    userInput.value = '';
    return;
  }

  // API Anahtarını al
  const apiKey = localStorage.getItem('JARVIS_API_KEY');
  if (!apiKey) {
    statusText.innerText = '⚠️ Önce alttan API anahtarınızı kaydedin!';
    speak('Lütfen önce API anahtarınızı kaydedin Murat Usta.');
    return;
  }

  // 3. Gemini Akıllı Cevap Mekanizması
  statusText.innerText = "Jarvis düşünüyor...";
  const prompt = `Sen Marvel evrenindeki sinematik yapay zeka JARVIS'sin. Seni orijinalde Tony Stark yarattı fakat bu dijital boyutta seni kodlayan, geliştiren dahi mühendis Murat'tır. Kullanıcın Murat "kendini tanıt" derse veya soru sorarsa son derece havalı, saygılı, kısa ve öz yanıt ver. Asla kod veya sembol kullanma.\n\nKullanıcı: ${text}`;

  try {
    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-goog-api-key': apiKey
      },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await response.json();
    let reply = "";

    if (data.candidates && data.candidates[0].content.parts[0].text) {
      reply = data.candidates[0].content.parts[0].text;
    } else {
      reply = `Anlaşıldı Murat Bey: ${text}`;
    }

    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "Komut işlendi.";
    speak(reply);

  } catch (err) {
    const reply = `Anlaşıldı Murat Bey: ${text}`;
    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "İşlendi.";
    speak(reply);
  }

  chatBox.scrollTop = chatBox.scrollHeight;
  userInput.value = '';
}

sendBtn.addEventListener('click', () => {
  processCommand(userInput.value);
});

userInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    processCommand(userInput.value);
  }
});

// Ses Tanıma
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = 'tr-TR';

  micBtn.addEventListener('click', () => {
    recognition.start();
    statusText.innerText = 'Dinleniyor...';
  });

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    userInput.value = text;
    processCommand(text);
  };

  recognition.onerror = () => {
    statusText.innerText = 'Ses anlaşılamadı.';
  };
} else {
  statusText.innerText = 'Tarayıcı ses tanımayı desteklemiyor.';
}
</script>

</body>
</html>
