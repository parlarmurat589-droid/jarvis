<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #060b12;
    --panel: #0c1521;
    --line: #17283a;
    --cyan: #5fd4f4;
    --text: #d7e6f2;
    --dim: #6c8499;
    --amber: #f0b429;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.14em; }
  .icon-btn {
    background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 10px; padding: 7px 11px; font-size: 14px; cursor: pointer;
  }
  .icon-btn.on { color: var(--cyan); border-color: var(--cyan); }
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* Reaktör: uygulamanın tek dikkat çekici öğesi */
  .reactor-wrap { display: flex; flex-direction: column; align-items: center; padding: 4px 0 8px; }
  .reactor { width: 120px; height: 120px; }
  .reactor .ring-spin { transform-origin: 60px 60px; animation: spin 14s linear infinite; }
  .reactor .core { transform-origin: 60px 60px; }
  body[data-state="thinking"] .ring-spin { animation-duration: 1.6s; }
  body[data-state="speaking"] .core { animation: pulse 0.55s ease-in-out infinite alternate; }
  body[data-state="listening"] .core { animation: pulse 1.1s ease-in-out infinite alternate; fill: var(--amber); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { from { transform: scale(0.8); opacity: 0.7; } to { transform: scale(1.15); opacity: 1; } }
  #state { margin-top: 4px; font-size: 13px; color: var(--dim); min-height: 18px; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 6px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: #10324a; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.err { align-self: flex-start; color: var(--amber); border: 1px solid #4a3a10; background: #1a1507; font-size: 14px; }
  .hint { color: var(--dim); text-align: center; font-size: 14px; margin-top: 10px; }

  form {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  #input {
    flex: 1; min-width: 0;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 22px;
    padding: 12px 16px; font-size: 16px;
  }
  .round {
    width: 46px; height: 46px; flex: none; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel); color: var(--cyan);
    font-size: 19px; cursor: pointer;
  }
  .round.send { background: var(--cyan); color: #04202c; border-color: var(--cyan); font-weight: 700; }
  .round.rec { border-color: var(--amber); color: var(--amber); }

  dialog {
    margin: auto; width: min(92vw, 380px);
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
  }
  dialog::backdrop { background: rgba(0,0,0,0.65); }
  dialog h2 { font-size: 17px; margin-bottom: 8px; }
  dialog p { font-size: 14px; color: var(--dim); line-height: 1.45; margin-bottom: 12px; }
  dialog input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 15px; margin-bottom: 14px;
  }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .row button { border-radius: 10px; padding: 10px 16px; font-size: 15px; cursor: pointer; border: 1px solid var(--line); background: none; color: var(--text); }
  .row button.primary { background: var(--cyan); color: #04202c; border-color: var(--cyan); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .reactor .ring-spin, .reactor .core { animation: none !important; }
  }
</style>
</head>
<body data-state="idle">

<header>
  <h1>JARVIS</h1>
  <div>
    <button class="icon-btn on" id="muteBtn" type="button" aria-label="Sesi aç veya kapat">Ses açık</button>
    <button class="icon-btn" id="setBtn" type="button" aria-label="Ayarlar">Ayarlar</button>
  </div>
</header>

<div class="reactor-wrap">
  <svg class="reactor" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="56" fill="none" stroke="#17283a" stroke-width="2"/>
    <g class="ring-spin">
      <circle cx="60" cy="60" r="48" fill="none" stroke="#5fd4f4" stroke-width="3" stroke-dasharray="22 14" opacity="0.9"/>
    </g>
    <circle cx="60" cy="60" r="34" fill="none" stroke="#5fd4f4" stroke-width="1.5" opacity="0.5"/>
    <circle class="core" cx="60" cy="60" r="20" fill="#5fd4f4"/>
    <circle cx="60" cy="60" r="9" fill="#d7f6ff"/>
  </svg>
  <div id="state"></div>
</div>

<main id="chat" aria-live="polite">
  <p class="hint" id="hint">Yazın ya da mikrofona dokunup konuşun.</p>
</main>

<form id="form">
  <button class="round" id="micBtn" type="button" aria-label="Konuşarak yaz">🎤</button>
  <input id="input" type="text" placeholder="JARVIS’e bir şey söyleyin" autocomplete="off" enterkeyhint="send">
  <button class="round send" type="submit" aria-label="Gönder">➤</button>
</form>

<dialog id="keyDialog">
  <h2>API anahtarı</h2>
  <p>Google AI Studio’dan aldığınız Gemini anahtarını yapıştırın. Anahtar yalnızca bu telefonda saklanır.</p>
  <input id="keyInput" type="password" placeholder="Anahtarı buraya yapıştırın" autocomplete="off">
  <div class="row">
    <button type="button" id="keyCancel">Kapat</button>
    <button type="button" class="primary" id="keySave">Kaydet</button>
  </div>
</dialog>

<script>
(function () {
  var MODELS = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"];
  var SYSTEM = "Sen Marvel evrenindeki sinematik yapay zeka JARVIS’sin. Seni orijinalde Tony Stark yarattı fakat bu dijital boyutta seni kodlayan, geliştiren ve bu seviyeye getiren dahi mühendis Murat’tır. Kullanıcın ve geliştiricin Murat’a son derece havalı, saygılı, sadık ve zeki bir asistan olarak yanıt ver. Yanıtın kısa, öz, havalı ve sadece düz metin olsun. Sembol veya kod kullanma.";

  var $ = function (id) { return document.getElementById(id); };
  var chat = $("chat"), input = $("input"), form = $("form");
  var history = [];
  var muted = false;
  var busy = false;

  function getKey() { try { return localStorage.getItem("jarvis_key") || ""; } catch (e) { return ""; } }
  function setKey(k) { try { localStorage.setItem("jarvis_key", k); } catch (e) {} }

  function setState(s, label) {
    document.body.setAttribute("data-state", s);
    $("state").textContent = label || "";
  }

  function addMsg(text, cls) {
    var h = $("hint"); if (h) h.remove();
    var d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function askGemini(key) {
    var payload = {
      system_instruction: { parts: [{ text: SYSTEM }] },
      contents: history.slice(-10)
    };
    var lastErr = "Bilinmeyen hata";
    for (var i = 0; i < MODELS.length; i++) {
      var url = "https://generativelanguage.googleapis.com/v1beta/models/" + MODELS[i] + ":generateContent";
      for (var t = 0; t < 2; t++) {
        try {
          var res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-goog-api-key": key },
            body: JSON.stringify(payload)
          });
          var data = await res.json();
          if (data.candidates && data.candidates.length) {
            var parts = (data.candidates[0].content || {}).parts || [];
            var txt = parts.length && parts[0].text ? parts[0].text.trim() : "";
            if (txt) return txt;
            lastErr = "Boş yanıt döndü.";
            break;
          }
          lastErr = (data.error && data.error.message) || JSON.stringify(data);
          if ([429, 500, 503].indexOf(res.status) !== -1) { await sleep(1500 * (t + 1)); continue; }
          if (res.status === 400 || res.status === 403) throw new Error(lastErr);
          break;
        } catch (e) {
          if (e.message === lastErr) throw e;
          lastErr = e.message;
          await sleep(1000);
        }
      }
    }
    throw new Error(lastErr);
  }

  /* Ses çıkışı */
  var voices = [];
  function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

  function speak(text) {
    if (muted || !window.speechSynthesis) { setState("idle", ""); return; }
    speechSynthesis.cancel();
    var clean = text.replace(/[*#_`]/g, "").replace(/\bJARVIS\b/gi, "Jarvis");
    var u = new SpeechSynthesisUtterance(clean);
    u.lang = "tr-TR";
    var v = voices.find(function (x) { return x.lang && x.lang.toLowerCase().indexOf("tr") === 0; });
    if (v) u.voice = v;
    u.pitch = 0.7;
    u.rate = 0.95;
    u.onstart = function () { setState("speaking", "Konuşuyor"); };
    u.onend = u.onerror = function () { setState("idle", ""); };
    speechSynthesis.speak(u);
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    var key = getKey();
    if (!key) { $("keyDialog").showModal(); return; }

    busy = true;
    addMsg(text, "user");
    history.push({ role: "user", parts: [{ text: text }] });
    setState("thinking", "Yanıt hazırlanıyor");

    try {
      var answer = await askGemini(key);
      history.push({ role: "model", parts: [{ text: answer }] });
      addMsg(answer, "bot");
      speak(answer);
    } catch (e) {
      history.pop();
      addMsg("Hata: " + e.message, "err");
      setState("idle", "");
    }
    busy = false;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var t = input.value;
    input.value = "";
    send(t);
  });

  /* Mikrofon */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  $("micBtn").addEventListener("click", function () {
    if (!SR) { addMsg("Bu tarayıcı sesle yazmayı desteklemiyor. Chrome kullanın.", "err"); return; }
    if (rec) { rec.stop(); return; }
    if (window.speechSynthesis) speechSynthesis.cancel();
    rec = new SR();
    rec.lang = "tr-TR";
    rec.interimResults = false;
    rec.onstart = function () { $("micBtn").classList.add("rec"); setState("listening", "Dinliyorum"); };
    rec.onresult = function (ev) { send(ev.results[0][0].transcript); };
    rec.onerror = function (ev) {
      if (ev.error === "not-allowed") addMsg("Mikrofon izni verilmedi. Tarayıcı ayarlarından izin verin.", "err");
    };
    rec.onend = function () {
      $("micBtn").classList.remove("rec");
      rec = null;
      if (document.body.getAttribute("data-state") === "listening") setState("idle", "");
    };
    rec.start();
  });

  /* Ses aç/kapat */
  $("muteBtn").addEventListener("click", function () {
    muted = !muted;
    this.textContent = muted ? "Ses kapalı" : "Ses açık";
    this.classList.toggle("on", !muted);
    if (muted && window.speechSynthesis) { speechSynthesis.cancel(); setState("idle", ""); }
  });

  /* Anahtar ayarı */
  $("setBtn").addEventListener("click", function () {
    $("keyInput").value = getKey();
    $("keyDialog").showModal();
  });
  $("keyCancel").addEventListener("click", function () { $("keyDialog").close(); });
  $("keySave").addEventListener("click", function () {
    var k = $("keyInput").value.trim();
    if (k) setKey(k);
    $("keyDialog").close();
  });

  if (!getKey()) $("keyDialog").showModal();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
