<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0f19;
      color: #00f2ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .container {
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    .arc-reactor {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid #00f2ff;
      box-shadow: 0 0 20px #00f2ff;
      margin: 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .core {
      width: 40px;
      height: 40px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px #ffffff;
    }
    #status {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #7ef2ff;
    }
    #chat-box {
      background: rgba(0, 242, 255, 0.05);
      border: 1px solid #00f2ff;
      border-radius: 10px;
      padding: 12px;
      height: 220px;
      overflow-y: auto;
      margin-bottom: 12px;
      text-align: left;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    #user-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #00f2ff;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    #send-btn {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #00f2ff;
      color: #0b0f19;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>JARVIS</h1>
  
  <!-- MİKROFON BUTONU -->
  <div class="arc-reactor" id="mic-btn">
    <div class="core"></div>
  </div>
  
  <div id="status">Hazır...</div>
  
  <!-- MESAJ GEÇMİŞİ -->
  <div id="chat-box"></div>
  
  <!-- YAZMA KUTUSU VE GÖNDER BUTONU -->
  <div class="input-group">
    <input type="text" id="user-input" placeholder="Jarvis'e bir şeyler yazın...">
    <button id="send-btn">Gönder</button>
  </div>
</div>

<script>
  const micBtn = document.getElementById('mic-btn');
  const status = document.getElementById('status');
  const chatBox = document.getElementById('chat-box');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  function processCommand(text) {
    if (!text || text.trim() === "") return;
    
    // Kullanıcı mesajını yazdır
    chatBox.innerHTML += `<p style="color:#ffffff;"><b>Siz:</b> ${text}</p>`;
    const lowerText = text.toLowerCase();

    // Spotify Kontrolü
    if (lowerText.includes("spotify")) {
      chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> Emredersiniz Murat Bey, Spotify açılıyor...</p>`;
      status.innerText = "Spotify çalıştırılıyor...";
      window.location.href = "macrodroid://action?name=spotify";
    } else {
      chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> Komut alındı Murat Bey: "${text}"</p>`;
      status.innerText = "Komut işlendi.";
    }
    
    chatBox.scrollTop = chatBox.scrollHeight;
    userInput.value = "";
  }

  // Butona basarak gönderme
  sendBtn.addEventListener('click', () => {
    processCommand(userInput.value);
  });

  // Enter tuşuna basarak gönderme
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      processCommand(userInput.value);
    }
  });

  // Sesli Mikrofon Dinleme
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (Recognition) {
    const recognition = new Recognition();
    recognition.lang = 'tr-TR';

    micBtn.addEventListener('click', () => {
      recognition.start();
      status.innerText = "Dinleniyor...";
    });

    recognition.onresult = (event) => {
      const text = event.results[0][0].transcript;
      processCommand(text);
    };

    recognition.onerror = () => {
      status.innerText = "Ses anlaşılamadı.";
    };
  } else {
    status.innerText = "Tarayıcınız ses tanımayı desteklemiyor.";
  }
</script>

</body>
</html>
