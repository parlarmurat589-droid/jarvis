<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0f19;
      color: #00f2ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .container {
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    .arc-reactor {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid #00f2ff;
      box-shadow: 0 0 20px #00f2ff;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .core {
      width: 35px;
      height: 35px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff;
    }
    #status {
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #7ef2ff;
      font-weight: bold;
    }
    #chat-box {
      background: rgba(0, 242, 255, 0.05);
      border: 1px solid #00f2ff;
      border-radius: 10px;
      padding: 10px;
      height: 180px;
      overflow-y: auto;
      margin-bottom: 10px;
      text-align: left;
      font-size: 0.9rem;
    }
    .input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }
    #user-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #00f2ff;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    #send-btn {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background: #00f2ff;
      color: #0b0f19;
      font-weight: bold;
      cursor: pointer;
    }
    .api-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed #00f2ff;
      padding: 8px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .api-section input {
      width: 100%;
      padding: 8px;
      margin-bottom: 5px;
      border-radius: 4px;
      border: 1px solid #00f2ff;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .api-section button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: #00f2ff;
      color: #0b0f19;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>JARVIS</h1>
  
  <div class="arc-reactor" id="mic-btn">
    <div class="core"></div>
  </div>

  <div id="status">Ekrana bir kez dokunun...</div>
  <div id="chat-box"></div>

  <div class="input-group">
    <input type="text" id="user-input" placeholder="Jarvis'e bir şeyler yazın...">
    <button id="send-btn">Gönder</button>
  </div>

  <div class="api-section">
    <input type="password" id="api-key-input" placeholder="Gemini API Anahtarınızı yapıştırın">
    <button id="save-api-btn">🔑 API Anahtarını Kaydet</button>
  </div>
</div>

<script>
const micBtn = document.getElementById('mic-btn');
const statusText = document.getElementById('status');
const chatBox = document.getElementById('chat-box');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const apiKeyInput = document.getElementById('api-key-input');
const saveApiBtn = document.getElementById('save-api-btn');

let audioUnlocked = false;

window.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('JARVIS_API_KEY');
  if (savedKey) {
    apiKeyInput.value = savedKey;
    statusText.innerText = "Sistemler aktif, sizi dinliyorum Murat Usta.";
  }
});

saveApiBtn.addEventListener('click', () => {
  const key = apiKeyInput.value.trim();
  if (key && key.length > 5) {
    localStorage.setItem('JARVIS_API_KEY', key);
    statusText.style.color = "#4ade80";
    statusText.innerText = "✅ API Anahtarı Kaydedildi!";
    setTimeout(() => {
      statusText.style.color = "#7ef2ff";
      statusText.innerText = "Hazır, komut verebilirsiniz Murat Usta.";
    }, 2000);
  } else {
    statusText.style.color = "#ef4444";
    statusText.innerText = "⚠️ Lütfen geçerli bir anahtar yapıştırın!";
  }
});

document.body.addEventListener('click', () => {
  if (!audioUnlocked) {
    const initUtterance = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(initUtterance);
    audioUnlocked = true;
  }
}, { once: true });

// 🔊 KESİN ÇÖZÜM: TÜRKÇE FONETİK OKUMA FONKSİYONU
function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    
    // Ekranda "JARVIS" yazacak ama ses motoru harf harf okumamak için "Ceyvis" olarak söyleyecek
    const readableText = text
      .replace(/JARVIS/g, "Ceyvis")
      .replace(/Jarvis/g, "Ceyvis");
    
    const utterance = new SpeechSynthesisUtterance(readableText);
    utterance.lang = 'tr-TR';
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}

async function processCommand(text) {
  if (!text || !text.trim()) return;

  chatBox.innerHTML += `<p style="color:#ffffff;"><b>Siz:</b> ${text}</p>`;
  const lowerText = text.toLowerCase();

  // 1. YouTube Komutu
  if (lowerText.includes('youtube')) {
    const reply = "Derhal Murat Usta, YouTube sistemini devreye sokuyorum.";
    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "YouTube açılıyor...";
    speak(reply);
    setTimeout(() => {
      window.location.href = "intent://www.youtube.com#Intent;scheme=https;package=com.google.android.youtube;end";
    }, 1200);
    userInput.value = '';
    return;
  }

  // 2. Spotify Komutu
  if (lowerText.includes('spotify')) {
    const reply = "Derhal Murat Bey, Spotify sistemini devralıyorum.";
    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "Spotify açılıyor...";
    speak(reply);
    setTimeout(() => {
      window.location.href = "intent://com.spotify.music/#Intent;scheme=android-app;end";
    }, 1200);
    userInput.value = '';
    return;
  }

  // 3. Kendini Tanıt Komutu
  if (lowerText.includes('tanıt') || lowerText.includes('kimsin')) {
    const reply = "Ben JARVIS. Orijinalde Tony Stark tarafından tasarlandım; fakat bu dijital boyutta beni geliştiren dahi mühendis Murat'tır. Size hizmet etmekten onur duyarım Murat Usta.";
    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "Tanıtım yapıldı.";
    speak(reply);
    chatBox.scrollTop = chatBox.scrollHeight;
    userInput.value = '';
    return;
  }

  // 4. API Anahtarı Kontrolü
  const apiKey = localStorage.getItem('JARVIS_API_KEY');
  if (!apiKey) {
    statusText.style.color = "#ef4444";
    statusText.innerText = '⚠️ Lütfen önce alttan API anahtarını kaydedin!';
    speak('Lütfen önce API anahtarınızı kaydedin Murat Usta.');
    return;
  }

  // 5. Gemini API Çağrısı
  statusText.style.color = "#7ef2ff";
  statusText.innerText = "Jarvis düşünüyor...";
  const prompt = `Sen Marvel evrenindeki sinematik yapay zeka JARVIS'sin. Seni orijinalde Tony Stark yarattı fakat bu dijital boyutta seni kodlayan, geliştiren dahi mühendis Murat'tır. Kullanıcın Murat'a son derece havalı, saygılı, kısa ve öz yanıt ver. Asla kod veya sembol kullanma.\n\nKullanıcı: ${text}`;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await response.json();
    let reply = "";

    if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
      reply = data.candidates[0].content.parts[0].text;
    } else {
      reply = `Anlaşıldı Murat Usta: ${text}`;
    }

    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "Komut işlendi.";
    speak(reply);

  } catch (err) {
    const reply = "Sistem bağlantı hatası alındı Murat Usta. API anahtarınızı kontrol edin.";
    chatBox.innerHTML += `<p style="color:#00f2ff;"><b>Jarvis:</b> ${reply}</p>`;
    statusText.innerText = "Hata oluştu.";
    speak(reply);
  }

  chatBox.scrollTop = chatBox.scrollHeight;
  userInput.value = '';
}

sendBtn.addEventListener('click', () => {
  processCommand(userInput.value);
});

userInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    processCommand(userInput.value);
  }
});

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = 'tr-TR';

  micBtn.addEventListener('click', () => {
    recognition.start();
    statusText.innerText = 'Dinleniyor...';
  });

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    userInput.value = text;
    processCommand(text);
  };

  recognition.onerror = () => {
    statusText.innerText = 'Ses anlaşılamadı.';
  };
} else {
  statusText.innerText = 'Tarayıcı ses tanımayı desteklemiyor.';
}
</script>

</body>
</html>
