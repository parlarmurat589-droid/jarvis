const saveApiBtn = document.getElementById('save-api-btn');

let audioUnlocked = false;

window.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('JARVIS_API_KEY');
  if (savedKey) {
    apiKeyInput.value = savedKey;
  }
});

saveApiBtn.addEventListener('click', () => {
  const key = apiKeyInput.value.trim();
  if (key) {
    localStorage.setItem('JARVIS_API_KEY', key);
    statusText.innerText = 'API Anahtarı kaydedildi! 🚀';
    speak('API anahtarı başarıyla kaydedildi Murat Usta.');
  } else {
    statusText.innerText = '⚠️ Geçerli bir anahtar girin.';
  }
});

document.body.addEventListener('click', () => {
  if (!audioUnlocked) {
    const initUtterance = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(initUtterance);
    audioUnlocked = true;
    statusText.innerText = 'Hazır...';
  }
}, { once: true });

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'tr-TR';
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}
