
        <!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0f19;
      color: #00f2ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .container {
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    .arc-reactor {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid #00f2ff;
      box-shadow: 0 0 25px #00f2ff;
      margin: 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .core {
      width: 40px;
      height: 40px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px #ffffff;
    }
    #status {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #7ef2ff;
    }
    #chat-box {
      background: rgba(0, 242, 255, 0.05);
      border: 1px solid #00f2ff;
      border-radius: 10px;
      padding: 12px;
      height: 220px;
      overflow-y: auto;
      margin-bottom: 12px;
      text-align: left;
    }
    .input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }
    #user-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #00f2ff;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    #send-btn {
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      background: #00f2ff;
      color: #0b0f19;
      font-weight: bold;
      cursor: pointer;
    }
    .api-btn {
      background: transparent;
      border: 1px dashed #00f2ff;
      color: #00f2ff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>JARVIS</h1>
  
  <div class="arc-reactor" id="mic-btn">
    <div class="core"></div>
  </div>

  <div id="status">Ekrana bir kez dokunun...</div>
  <div id="chat-box"></div>

  <div class="input-group">
    <input type="text" id="user-input" placeholder="Jarvis'e bir şeyler yazın...">
    <button id="send-btn">Gönder</button>
  </div>

  <button class="api-btn" onclick="setApiKey()">🔑 API Anahtarı Kaydet</button>
</div>

<script>
const micBtn = document.getElementById('mic-btn');
const statusText = document.getElementById('status');
const chatBox = document.getElementById('chat-box');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

let audioUnlocked = false;

// API Anahtarını Kaydetme Fonksiyonu
function setApiKey() {
  const key = prompt("Lütfen Gemini API Anahtarınızı girin:");
  if (key) {
    localStorage.setItem('JARVIS_API_KEY', key.trim());
    alert("API Anahtarı başarıyla kaydedildi! 🚀");
  }
}

function getApiKey() {
  let key = localStorage.getItem('JARVIS_API_KEY');
  if (!key) {
    key = prompt("Lütfen devam etmek için Gemini API Anahtarınızı girin:");
    if (key) {
      localStorage.setItem('JARVIS_API_KEY', key.trim());
    }
  }
  return key;
}

// Mobil ses izni
document.body.addEventListener('click', () => {
  if (!audioUnlocked) {
    const initUtterance = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(initUtterance);
    audioUnlocked = true;
    statusText.innerText = 'Hazır...';
  }
}, { once: true });

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'tr-TR';
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}
